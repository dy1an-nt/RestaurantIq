name: CI

# Quality gate for RestaurantIQ (added in Sprint R).
#
# Before this existed, nothing ran the tests, typecheck, lint, or audit before
# code reached main - which is how a red test suite and a dead lint script
# landed unnoticed. This workflow makes those gates mandatory on every push and
# pull request so broken code is rejected automatically instead of relying on
# the author remembering to run them.
#
# The repo is doubly-nested (git root -> RestaurantIQ/ -> app packages). Both
# app packages run the same gate sequence, so they share one matrix job and
# differ only in the two steps that are genuinely package-specific: the backend
# has a Jest suite, the frontend has a Vite build.

on:
  push:
    branches: [main]
  pull_request:

# CI compiles, tests, and audits. It never writes to the repository, so the
# token gets read-only scope instead of whatever the repo default happens to
# be. Naming any permission drops every unnamed one to `none`.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind a
# stale one. The group is keyed by workflow as well as ref, so a future
# workflow cannot collide with this one's group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documentation accuracy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check documentation facts and paths
        run: node scripts/check-docs.mjs

  package:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # A red backend should not cancel the frontend run. Seeing both failures
      # in one push beats fixing one, pushing, and discovering the other.
      fail-fast: false
      matrix:
        include:
          - name: Backend (typecheck · lint · test · audit)
            directory: RestaurantIQ/restaurantiq-backend
            test: true
            build: false
          - name: Frontend (typecheck · lint · build · audit)
            directory: RestaurantIQ/restaurantiq-frontend
            test: false
            build: true
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 hit end-of-life April 2026; 22 is the active LTS and
          # matches the engines pin in both package.jsons. scripts/check-docs.mjs
          # fails CI if this drifts from those pins or from the README.
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install (clean, lockfile-pinned)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        if: matrix.test
        run: npm test
      - name: Build
        # tsc alone doesn't catch Vite/Rollup failures (case-sensitive imports
        # on Linux, asset resolution) - without this they first surface at the
        # Vercel deploy, after merge.
        if: matrix.build
        run: npm run build
      - name: Audit production dependencies (fail on high+)
        run: npm audit --omit=dev --audit-level=high
