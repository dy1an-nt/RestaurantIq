name: Uptime

# External uptime monitoring for the deployed backend.
#
# Render's own healthcheck restarts an unhealthy container but never tells
# anyone it happened, so an outage between manual log checks is invisible - the
# gap recorded in docs/known-limitations.md. This workflow is the outside
# observer: a process inside the app cannot report that the app is down.
#
# Setup (one-time): add a repository variable HEALTH_URL pointing at the
# deployed health endpoint, e.g. https://<backend>.onrender.com/health
#   Settings -> Secrets and variables -> Actions -> Variables -> New variable
# Without it every run skips, so the workflow is inert until configured.
#
# What the cadence below actually buys you, measured rather than assumed: over
# the 60 scheduled runs before 2026-09-08, the average gap between runs was
# 194 minutes, with a spread of 45 to 339. GitHub runs `schedule` on a
# best-effort queue and drops most ticks on a repo this size, so the `*/5`
# cron is an upper bound on frequency, not a promise. Treat this as "something
# noticed the outage eventually", not as minute-resolution monitoring.
# docs/operations.md documents an external monitor (UptimeRobot / Better Stack)
# as the option that actually delivers a tight interval.

on:
  schedule:
    # Every 5 minutes in principle. See the measured cadence note above.
    - cron: '*/5 * * * *'
  # Allow a manual run to verify the workflow itself works.
  workflow_dispatch:

# Never let two checks overlap; a slow run should not stack up behind itself.
concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  # Needed only to open, comment on, and close the outage issue.
  issues: write

jobs:
  health:
    name: Probe /health
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Read through the environment, never interpolated into a `run:` body.
      # A `${{ }}` expression is pasted into the script before bash parses it,
      # so its contents become shell source; $HEALTH_URL is only ever data.
      HEALTH_URL: ${{ vars.HEALTH_URL }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL repository variable is not set - skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Probe health endpoint
        id: probe
        if: steps.config.outputs.configured == 'true'
        run: |
          # Three attempts, 20s apart. A single failed request is usually a
          # transient blip (deploy restart, network hiccup); paging on it
          # trains everyone to ignore the alert. Three in a row is a signal.
          #
          # The 45s ceiling is sized for a cold start, not for a warm request.
          # Render's free tier sleeps an idle service, and because the schedule
          # above fires hours apart rather than minutes, essentially every probe
          # is the request that wakes it. At the previous 20s ceiling attempt 1
          # timed out on all 60 of the last runs and attempt 2 succeeded, which
          # quietly spent one of the three strikes on a cold start every time.
          attempt=1
          max=3
          while [ "$attempt" -le "$max" ]; do
            # Clear the body file first: curl leaves the PREVIOUS response in
            # place when it cannot connect, which would report a stale body in
            # the outage issue. Capture the status separately so a failed curl
            # yields one "000", not the doubled value `|| echo` produces.
            rm -f /tmp/health.json
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
              --connect-timeout 10 --max-time 45 "$HEALTH_URL" || true)
            code="${code:-000}"
            body=$(head -c 300 /tmp/health.json 2>/dev/null || true)

            if [ "$code" = "200" ] && printf '%s' "$body" | grep -q '"status":"ok"'; then
              echo "Attempt $attempt: healthy ($code)"
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt $attempt/$max failed: HTTP $code, body: ${body:-<empty>}"
            last_code="$code"
            last_body="$body"
            attempt=$((attempt + 1))
            if [ "$attempt" -le "$max" ]; then
              sleep 20
            fi
          done

          # The delimiter is random because the body is remote-controlled: a
          # response containing a line that matches a fixed delimiter would end
          # the block early and let the rest of the body write arbitrary step
          # outputs. Same class of bug as SQL injection, one layer down.
          delimiter="EOF_$(openssl rand -hex 16)"
          {
            echo "healthy=false"
            echo "code=${last_code:-000}"
            echo "body<<${delimiter}"
            echo "${last_body:-<empty>}"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          exit 1

      - name: Open or update outage issue
        # Runs only when the probe actually failed - not when it was skipped
        # for missing configuration, and not when a previous step errored.
        if: failure() && steps.probe.outputs.healthy == 'false'
        uses: actions/github-script@v9
        env:
          LAST_CODE: ${{ steps.probe.outputs.code }}
          LAST_BODY: ${{ steps.probe.outputs.body }}
        with:
          script: |
            const title = 'Backend health check failing';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const detail =
              `Health probe failed 3 consecutive times.\n\n` +
              `- HTTP status: \`${process.env.LAST_CODE}\`\n` +
              `- Response body: \`${(process.env.LAST_BODY || '').trim()}\`\n` +
              `- Run: ${runUrl}\n` +
              `- Checked at: ${new Date().toISOString()}\n\n` +
              `Runbook: \`RestaurantIQ/docs/operations.md\``;

            // Reuse an existing open issue so a sustained outage produces one
            // thread with comments, not one issue every five minutes.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
              per_page: 20,
            });
            const existing = open.find((i) => i.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing.\n\n${detail}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['uptime'],
                body: detail,
              });
            }

      - name: Resolve outage issue on recovery
        # An outage thread that nobody closes is indistinguishable from a live
        # outage. The probe is the only thing that knows the service came back,
        # so it is the thing that has to say so.
        if: steps.probe.outputs.healthy == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Backend health check failing';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
              per_page: 20,
            });
            const existing = open.find((i) => i.title === title);
            if (!existing) return;

            // Comment before closing. The close alone records that it ended,
            // not how long it lasted, and the outage window is the first thing
            // anyone asks for in a postmortem. Bounds are approximate: the
            // opening probe and this one are the observations, and the schedule
            // between them is coarse (see the cadence note at the top).
            const openedAt = new Date(existing.created_at);
            const recoveredAt = new Date();
            const minutes = Math.round((recoveredAt - openedAt) / 60000);
            const duration =
              minutes >= 120
                ? `~${(minutes / 60).toFixed(1)} hours`
                : `~${minutes} minutes`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body:
                `Recovered. \`/health\` returned 200 with \`"status":"ok"\`.\n\n` +
                `- Issue opened: ${openedAt.toISOString()}\n` +
                `- Recovery observed: ${recoveredAt.toISOString()}\n` +
                `- Outage window: ${duration} (bounded by probe times, not exact)\n` +
                `- Run: ${runUrl}\n\n` +
                `Closing. A later failure reopens a new thread rather than ` +
                `reusing this one, so the history stays one issue per outage.`,
            });

            // 'completed' rather than 'not_planned': the thread did its job and
            // the condition it tracked is resolved. 'not_planned' renders as
            // dropped work, which is the wrong signal for a fixed outage.
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });
